<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コーキング検索くん</title>
<style>
:root{
  --bg:#eeece5;
  --surface:#ffffff;
  --surface-2:#f5f3ec;
  --ink:#26221d;
  --sub:#716a5d;
  --border:#ddd6c6;
  --accent:#d9680f;
  --accent-ink:#ffffff;
  --accent-soft:#f7e3cf;
  --good:#2f7d5e;
  --good-soft:#e1efe7;
  --bad:#b8462b;
  --bad-soft:#fbe4dd;
  --shadow: 0 1px 2px rgba(38,34,29,.06), 0 6px 16px rgba(38,34,29,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1a16;
    --surface:#242119;
    --surface-2:#2a271e;
    --ink:#efe9dd;
    --sub:#a89d89;
    --border:#3c362a;
    --accent:#f0924b;
    --accent-ink:#231400;
    --accent-soft:#3a2a17;
    --good:#5cbb90;
    --good-soft:#1e332a;
    --bad:#e8836a;
    --bad-soft:#3a241d;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1c1a16;
  --surface:#242119;
  --surface-2:#2a271e;
  --ink:#efe9dd;
  --sub:#a89d89;
  --border:#3c362a;
  --accent:#f0924b;
  --accent-ink:#231400;
  --accent-soft:#3a2a17;
  --good:#5cbb90;
  --good-soft:#1e332a;
  --bad:#e8836a;
  --bad-soft:#3a241d;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  padding-inline:16px;
  padding-block:0 28px;
}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric: tabular-nums;}

a{color:inherit}

/* ---------- header ---------- */
.topbar{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:10;
  background:var(--bg);
  padding-block:14px 10px;
  margin-inline:-16px;
  padding-inline:16px;
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:12px;
}
.brand h1{
  font-size:20px;
  font-weight:900;
  letter-spacing:.01em;
  margin:0;
  white-space:nowrap;
}
.brand .kun{color:var(--accent)}
.brand .tagline{
  font-size:12px;
  color:var(--sub);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.searchbox{
  position:relative;
  display:flex;
  align-items:center;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
}
.searchbox:focus-within{
  border-color:var(--accent);
}
.searchbox svg{
  flex:none;
  margin-inline:12px;
  color:var(--sub);
}
#q{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  color:var(--ink);
  font-family:inherit;
  font-size:16px;
  padding-block:13px;
  padding-inline-end:8px;
  min-width:0;
}
#q::placeholder{color:var(--sub)}
#clearBtn{
  flex:none;
  border:none;
  background:none;
  color:var(--sub);
  cursor:pointer;
  padding:8px 12px;
  font-size:13px;
  border-radius:8px;
}
#clearBtn:hover{color:var(--ink)}
#clearBtn[hidden]{display:none!important}

.chiprow{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-block:10px 2px;
  scrollbar-width:none;
}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:999px;
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--sub);
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
}
.chip .n{
  font-family:"JetBrains Mono",monospace;
  font-weight:400;
  opacity:.75;
}
.chip[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--ink);
}
.chip[aria-pressed="true"] .n{color:var(--accent)}

/* ---------- main ---------- */
main{padding-top:16px}

.hint{
  color:var(--sub);
  font-size:13px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:2px 2px 14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  gap:10px;
  margin-bottom:20px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 14px 12px;
  box-shadow:var(--shadow);
}
.stat .num{
  font-family:"JetBrains Mono",monospace;
  font-size:26px;
  font-weight:700;
  color:var(--accent);
  line-height:1.1;
}
.stat .lbl{
  font-size:12.5px;
  color:var(--sub);
  margin-top:4px;
  font-weight:500;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  font-size:12px;
  color:var(--sub);
  border:1px dashed var(--border);
  border-radius:var(--radius);
  padding:10px 14px;
  margin-bottom:18px;
}
.legend b{color:var(--ink); font-weight:700}
.legend .ok{color:var(--good); font-weight:700}
.legend .ng{color:var(--bad); font-weight:700}

#resultMeta{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font-size:12.5px;
  color:var(--sub);
  padding:0 2px 8px;
}
#resultMeta b{color:var(--ink); font-family:"JetBrains Mono",monospace}

#results{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.card-top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.makerbadge{
  flex:none;
  font-size:11px;
  font-weight:700;
  color:var(--sub);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:2px 7px;
}
.code{
  font-family:"JetBrains Mono",monospace;
  font-weight:700;
  font-size:14px;
  letter-spacing:.01em;
}
.note{
  margin-left:auto;
  font-size:11.5px;
  color:var(--sub);
  text-align:right;
}

.card-colors{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-size:13.5px;
}
.colcell{display:flex; flex-direction:column; gap:1px; min-width:0}
.colcell .k{font-size:10.5px; color:var(--sub); font-weight:700; letter-spacing:.02em}
.colcell .v{overflow-wrap:anywhere}
.arrow{color:var(--sub); flex:none}
.colorno{
  font-family:"JetBrains Mono",monospace;
  font-weight:700;
  color:var(--accent-ink);
  background:var(--accent);
  border-radius:6px;
  padding:1px 8px;
  font-size:12.5px;
  flex:none;
}

.card-bottom{
  display:flex;
  align-items:center;
  gap:8px;
}
.avail{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
  padding:2px 8px;
  border-radius:999px;
}
.avail.ok{color:var(--good); background:var(--good-soft)}
.avail.ng{color:var(--bad); background:var(--bad-soft)}
.avail.na{color:var(--sub); background:var(--surface-2)}

.unmatched{border-left:3px solid var(--bad)}

.empty{
  text-align:center;
  color:var(--sub);
  font-size:13.5px;
  padding:40px 12px;
}
.empty svg{opacity:.35; margin-bottom:10px}

.morebar{
  text-align:center;
  color:var(--sub);
  font-size:12.5px;
  padding:14px 4px 4px;
}

footer{
  text-align:center;
  color:var(--sub);
  font-size:11px;
  padding-top:24px;
  opacity:.7;
}

@media (max-width: 480px){
  .brand{flex-wrap:wrap}
  .brand h1{font-size:18px}
  .card-colors{gap:6px}
}
</style>
</head>

  function normalize(str){
    if(!str) return '';
    var s = String(str);
    s = s.replace(/[！-～]/g, function(ch){
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    });
    s = s.replace(/　/g, ' ');
    var out = '';
    for (var i = 0; i < s.length; i++){
      var ch = s[i];
      out += zen2han[ch] || ch;
    }
    return out.toLowerCase().trim();
  }

  function esc(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function buildIndex(rec){
    return normalize([rec.m, rec.c, rec.s, rec.a, rec.n, rec.note].join(' '));
  }

    chipsWrap.innerHTML = MAKERS.map(function(mk){

  function availPill(v){

    return '';

    if (rec.k || rec.l){
      bottom = '<div class="card-bottom">' +
        (rec.k ? '<span class="avail-label">カート</span>' + availPill(rec.k) : '') +
        (rec.l ? '<span class="avail-label">6L</span>' + availPill(rec.l) : '') +
        '</div>';
    }
    return '<div class="' + cls + '">' +
      '<div class="card-top">' +
        '<span class="makerbadge">' + esc(rec.m) + '</span>' +
        '<span class="code">' + esc(rec.c) + '</span>' +

      '</div>' +
      '<div class="card-colors">' +

        '<span class="arrow">→</span>' +
        '<div class="colcell"><span class="k">オートン色</span><span class="v">' + esc(rec.a) + '</span></div>' +
        (rec.n ? '<span class="colorno">' + esc(rec.n) + '</span>' : '') +

      moreBar.hidden = true;
      resultsWrap.innerHTML = '';
      hintline.textContent = '品番・サイディング色名・オートン色名・色番号のどれからでも検索できます。';
      return;
    }

    statsWrap.hidden = true;
    hintline.textContent = '';

    var matches = [];
    for (var i = 0; i < DATA.length; i++){
      var rec = DATA[i];
      if (!activeMakers.has(rec.m)) continue;
      var hay = rec._idx;
      var hit = true;
      for (var j = 0; j < terms.length; j++){
        if (hay.indexOf(terms[j]) === -1){ hit = false; break; }
      }
      if (hit) matches.push(rec);
    }

    resultMeta.hidden = false;
    resultMeta.innerHTML = '<span><b>' + matches.length.toLocaleString('ja-JP') + '</b> 件ヒット</span>' +
      (matches.length > MAX_RESULTS ? '<span>先頭 ' + MAX_RESULTS + ' 件を表示中</span>' : '<span></span>');

    if (matches.length === 0){
      resultsWrap.innerHTML = '<div class="empty">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<div>該当する品番・色が見つかりませんでした。<br>キーワードを短くするか、メーカーの絞り込みを見直してください。</div></div>';
      moreBar.hidden = true;
      return;
    }

    var shown = matches.slice(0, MAX_RESULTS);
    resultsWrap.innerHTML = shown.map(cardHTML).join('');

    if (matches.length > MAX_RESULTS){
      moreBar.hidden = false;
      moreBar.textContent = '他 ' + (matches.length - MAX_RESULTS).toLocaleString('ja-JP') + ' 件 — キーワードを追加して絞り込んでください';
    } else {
      moreBar.hidden = true;
    }
  }

  chipsWrap.addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if (!btn) return;
    var mk = btn.getAttribute('data-maker');
    if (activeMakers.has(mk)){
      if (activeMakers.size > 1){ activeMakers.delete(mk); }
    } else {
      activeMakers.add(mk);
    }
    btn.setAttribute('aria-pressed', activeMakers.has(mk) ? 'true' : 'false');
    render();
  });

  var debounceT = null;
  qInput.addEventListener('input', function(){
    clearTimeout(debounceT);
    debounceT = setTimeout(render, 40);
  });
  clearBtn.addEventListener('click', function(){
    qInput.value = '';
    qInput.focus();
    render();
  });

  var __raw = document.getElementById('ck-data').textContent;
  var data = JSON.parse(__raw);
  DATA = data;
  DATA.forEach(function(rec){ rec._idx = buildIndex(rec); });

  var counts = {};
  var order = [];
  DATA.forEach(function(rec){
    if (!(rec.m in counts)){ counts[rec.m] = 0; order.push(rec.m); }
    counts[rec.m]++;
  });
  MAKERS = order.map(function(name){ return { name: name, count: counts[name] }; });
  activeMakers = new Set(order);

  totalCountEl.textContent = DATA.length.toLocaleString('ja-JP');
  renderChips();
  renderStats();
  render();
})();
</script>

</body>
</html>
